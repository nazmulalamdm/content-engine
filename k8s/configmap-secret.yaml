apiVersion: v1
kind: ConfigMap
metadata:
  name: orchestrator-config
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  KAFKA_TOPIC_INPUT: "content.repurpose.raw"
  KAFKA_TOPIC_OUTPUT: "content.repurpose.completed"
  KAFKA_CONSUMER_GROUP: "content-orchestrator-group"
---
apiVersion: v1
kind: Secret
metadata:
  name: orchestrator-secret
type: Opaque
stringData:
  OPENAI_API_KEY: "sk-your-openai-api-key"